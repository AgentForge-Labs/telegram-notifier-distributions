[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-telegram-notifier"
version = "0.2.0"
description = "Official Python SDK and CLI for AgentForge Telegram Notifier"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{name = "AgentForge Labs"}]
keywords = ["telegram", "notifications", "agentforge", "mcp", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/AgentForge-Labs/telegram-notifier-public_commercial"
Documentation = "https://github.com/AgentForge-Labs/telegram-notifier-public_commercial/tree/main/sdk/python"
"Community gateway" = "https://pypi.org/project/agentforge-telegram-gateway/"

[project.scripts]
telegram-notifier = "agentforge_telegram_notifier.cli:main"
telegram-notifier-auth = "agentforge_telegram_notifier.auth_cli:main"

[tool.setuptools]
packages = ["agentforge_telegram_notifier"]
include-package-data = true

[tool.setuptools.package-data]
agentforge_telegram_notifier = ["py.typed"]
